<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schachtblick</title>
  <meta name="description" content="Schachtinspektion nach ISYBAU und DWA-M 149-2 – Foto von oben, Kodierung, ISYBAU-XML-Export. Läuft im Browser, ohne Installation. Von MMSE Software Engineering.">
  <meta name="author" content="MMSE Software Engineering, www.mmse-software.com">
  <meta name="theme-color" content="#0a5bd3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Schachtblick">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="sb-start" style="display:grid;place-items:center;min-height:100vh;color:#5b6b80;font:16px system-ui;text-align:center">Schachtblick wird geladen …<br><small>MMSE Software Engineering · www.mmse-software.com</small></div>
  </div>
  <noscript>Bitte JavaScript aktivieren – Schachtblick ist eine Web-App.</noscript>
  <script>
    // Startprüfung: Startet die App nicht (z. B. weil nach einem Update noch alte Dateien im Browser
    // liegen), erscheint ein Knopf, der den Zwischenspeicher leert und neu lädt.
    (function () {
      function hilfe() {
        var el = document.getElementById('sb-start');
        if (window.__sbGestartet || !el || el.getAttribute('data-hilfe')) return;
        el.setAttribute('data-hilfe', '1');
        el.innerHTML = '<div style="max-width:420px;padding:20px">Schachtblick startet nicht richtig – meist liegt nach einem Update noch eine ältere Version im Browser.<br><br>'
          + '<button id="sb-neu" style="font:600 16px system-ui;padding:12px 22px;border:0;border-radius:12px;background:#0a5bd3;color:#fff;cursor:pointer">Neu laden</button></div>';
        document.getElementById('sb-neu').onclick = function () {
          var p = [];
          if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }));
          Promise.all(p).catch(function () {}).then(function () { setTimeout(function () { location.reload(); }, 300); });
        };
      }
      window.addEventListener('error', function () { setTimeout(hilfe, 1500); });
      window.addEventListener('unhandledrejection', function () { setTimeout(hilfe, 1500); });
      setTimeout(hilfe, 12000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
